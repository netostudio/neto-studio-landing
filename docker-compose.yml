services:
  # Dev server (astro dev, hot reload) on :4321. /api/contact is proxied to
  # Make by the Vite proxy in astro.config.mjs, using MAKE_WEBHOOK_* from .env.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4321:4321'
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      - CHOKIDAR_USEPOLLING=true

  # The site as it runs on Cloudflare Workers, on :8788: static build plus the
  # Worker behind /api/contact, served by `wrangler dev` with wrangler.jsonc.
  # It builds the mounted source on start, so `make restart` picks up changes.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    ports:
      - '${WORKER_PORT:-8788}:8788'
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - path: .env
        required: false
