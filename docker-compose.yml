services:
  # Dev server (astro dev, hot reload). /api/contact is proxied to Make by the
  # Vite proxy in astro.config.mjs, using MAKE_WEBHOOK_* from .env.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4321:4321'
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Production image (static build served by nginx, which proxies
  # /api/contact to Make). Only started with `--profile prod` (make up-prod).
  prod:
    profiles: ['prod']
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        PUBLIC_CALENDLY_URL: ${PUBLIC_CALENDLY_URL:-}
    image: neto-landing:prod
    ports:
      - '${PROD_PORT:-8080}:80'
    environment:
      MAKE_WEBHOOK_URL: ${MAKE_WEBHOOK_URL:-}
      MAKE_WEBHOOK_APIKEY: ${MAKE_WEBHOOK_APIKEY:-}
